services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
    volumes:
      - dossier_jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  site-web:
    build: .
    container_name: test-site
    depends_on:
      - jenkins
    ports:
      - "8081:80"

volumes:
  dossier_jenkins: